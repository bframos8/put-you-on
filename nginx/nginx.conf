# Local dev nginx config (mkcert localhost certs, :443 only). The production config is
# nginx.prod.conf (real Let's Encrypt certs, :80 redirect + ACME, TLS hardening). The
# cert-independent behaviour below is kept in sync with prod so dev exercises the same
# proxying (real client IP for slowapi, /health reachable, gzip, long /api timeouts).

events {}

http {
  # gzip text/JSON responses (matches prod).
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript
             application/xml text/xml image/svg+xml application/rss+xml
             text/javascript;

  # Give the app the real client IP and scheme. uvicorn runs --proxy-headers, so
  # slowapi rate-limits by real IP even in dev. Set at http level so both locations
  # inherit them.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  client_max_body_size 10m;

  server {
    listen 443 ssl;
    ssl_certificate /certs/localhost+1.pem;
    ssl_certificate_key /certs/localhost+1-key.pem;

    # Backend liveness/readiness (root-mounted, no /api prefix).
    location /health {
      proxy_pass http://backend:8000;
    }

    # Backend API — long timeouts for the ML ingest/classify path (matches prod).
    location /api/ {
      proxy_pass http://backend:8000;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # Frontend (Next.js).
    location / {
      proxy_pass http://frontend:3000;
    }
  }
}
