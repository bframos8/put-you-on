# Production nginx config (gameplan Phase 4). Mounted into the nginx container by
# docker-compose.prod.yaml at /etc/nginx/nginx.conf. The dev config lives in
# nginx.conf (mkcert localhost certs, :443 only); this one terminates TLS with the
# real Let's Encrypt cert and fronts the whole app on the EC2 box.

events {}

http {
  # gzip text/JSON responses — smaller payloads, cheap and standard (4.4).
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript
             application/xml text/xml image/svg+xml application/rss+xml
             text/javascript;

  # Give the app the real client IP and scheme (4.2). uvicorn runs --proxy-headers,
  # so slowapi rate-limits by real IP (not one site-wide nginx bucket) and the app's
  # HSTS/scheme logic sees https. Set at http level so every proxied location inherits
  # these without repetition (locations below add only proxy_pass/timeouts, which does
  # not reset inherited headers).
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # No user uploads (JSON bodies only; audio is fetched server-side by spotdl), so a
  # modest cap is plenty (4.3).
  client_max_body_size 10m;

  # :80 — serve the ACME HTTP-01 challenge (webroot shared with the host's Certbot,
  # mounted in 3.5) and force everything else to HTTPS (4.1). Certbot's validator reads
  # this even though .app is HSTS-preloaded (it isn't a browser).
  server {
    listen 80;
    server_name putyouon.app;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # :443 — TLS termination in front of the app (4.1/4.4).
  server {
    listen 443 ssl;
    http2 on;
    server_name putyouon.app;

    ssl_certificate     /etc/letsencrypt/live/putyouon.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/putyouon.app/privkey.pem;

    # Mozilla "intermediate", ECDHE-only so no ssl_dhparam file is required (still an
    # SSL Labs A+). TLS 1.2 + 1.3; let the client's cipher preference win per Mozilla.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling intentionally omitted: Let's Encrypt retired OCSP in 2025 — issued
    # certs no longer carry an OCSP URL, so ssl_stapling would be inert and only log a
    # warning on each reload. HSTS is deliberately not set at this level: the app emits it
    # for the paths it serves (ENABLE_HSTS middleware) and `location /` below emits it for
    # the frontend, so every path has exactly one authority for the header.

    # Backend liveness/readiness. /health is root-mounted (no /api prefix) so external
    # uptime monitors and the nginx upstream check can hit a stable path.
    location /health {
      proxy_pass http://backend:8000;
    }

    # Backend API. The ingest/classify path can run long (audio download + embedding);
    # lift nginx's 60s default so a legitimate slow request isn't cut off with a 504 (4.3).
    location /api/ {
      proxy_pass http://backend:8000;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # Frontend (Next.js standalone).
    location / {
      proxy_pass http://frontend:3000;

      # SecurityHeadersMiddleware only runs for requests that reach FastAPI, so everything
      # proxied to Next.js used to arrive with no security headers at all (10.3) —
      # including `/`, the origin's entry point and the one hit that decides whether HSTS
      # ever takes effect in a browser.
      #
      # This location only, never at server level: add_header APPENDS, and a server-level
      # set would also be inherited by /health and /api/ where the middleware already sets
      # the same four, so every backend response would carry each header twice.
      #
      # `always` so they survive error responses — a 502 while the frontend container
      # restarts is precisely when you don't want to drop HSTS.
      #
      # No Content-Security-Policy here on purpose. The backend's `default-src 'none'` is
      # right for JSON that loads nothing, and would break every script, style, font and
      # album-art image on a Next.js page. A real frontend policy needs script/style/img/
      # font/connect allowlists plus a nonce for Next's inline bootstrap: its own pass.
      #
      # Careful if you ever add an add_header at server or http level — this block would
      # then REPLACE it rather than merge, because add_header inherits only when the
      # current level defines none of its own. Re-list anything you want kept.
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options    "nosniff" always;
      add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
      add_header X-Frame-Options           "DENY" always;
    }
  }
}
