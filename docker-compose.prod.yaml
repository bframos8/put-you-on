# Production topology for the EC2 instance (gameplan Phase 3).
#
# The box PULLS pre-built, tested images from ECR — it never builds. Building on the
# host would compete with the running app for CPU/RAM (the backend image is heavy) and
# couple every deploy to a working toolchain on the box (3.1). Bring the stack up with:
#   docker compose -f docker-compose.prod.yaml up -d
#
# BACKEND_IMAGE / FRONTEND_IMAGE are the full ECR refs including the git-SHA tag,
# exported by the deploy step (8.3). Keeping the whole ref in a variable — not just the
# tag — keeps the AWS account id out of the repo (the env_file/image boundary is the
# portability seam for the planned Hetzner move) and makes rollback a redeploy pinned to
# a previous SHA (10.4).
#
# Secrets and non-secret config in .env-backend / .env-postgres are materialized from
# SSM Parameter Store at deploy time with chmod 600 (5.2) — never baked into an image.
# nginx uses nginx/nginx.prod.conf (real server_name, HTTP->HTTPS redirect, forwarded
# headers, TLS hardening, gzip — Phase 4), separate from the dev nginx.conf.

services:

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - .env-backend
      - .env-postgres
    # RDS is the database now — the backend reaches it via POSTGRES_HOST (the RDS
    # endpoint) from env; there is no db service to depend on (3.2). The image bakes a
    # HEALTHCHECK on /health, so other services can gate on it being healthy.
    # Cap memory so a runaway (concurrent ingests spawning spotdl, or a leak) fails this
    # one container instead of OOM-ing the box and taking nginx/frontend with it (3.4).
    # ~313 MB for both models + transient spotdl/audio overhead. The host is a 2 GB
    # t3.small (6.1), so a 2 GB cap would equal host RAM and protect nothing: set it
    # below that, leaving room for the frontend/nginx, dockerd and the OS. Docker allows
    # up to 2x the limit in swap when memswap_limit is unset, and the box has a 2 GB
    # swapfile, so a spike during the TF model load degrades instead of being killed.
    # Confirm with `docker stats` after the first deploy and adjust.
    mem_limit: 1200m
    networks: [putyouon]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    # NEXT_PUBLIC_API_URL is inlined into the client bundle at BUILD time (CI --build-arg,
    # 8.2) — the runtime container needs no env. Don't start serving a UI whose only
    # backend isn't ready yet.
    depends_on:
      backend:
        condition: service_healthy
    networks: [putyouon]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # 80 is needed for the ACME HTTP-01 challenge and the HTTP->HTTPS redirect (Phase
      # 4/7); 443 serves real traffic over the Let's Encrypt cert.
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # Real Let's Encrypt certs live on the host, managed by Certbot (Phase 7).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Shared ACME webroot: Certbot on the host writes the challenge file here, nginx
      # serves it (read-only — nginx only reads the challenge).
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [putyouon]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Host metrics -> Grafana Cloud (gameplan 9.1). Only this one agent: cAdvisor is the
  # heaviest of the plan's three and the box has 2 GB (6.1), so containers and app RED
  # metrics wait for a later pass. Alloy's built-in unix exporter covers host CPU, memory,
  # disk and network, and disk is not a CloudWatch metric at all.
  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    # GRAFANA_PROM_URL / _USER / _TOKEN, materialized from SSM at deploy (5.2). Kept out
    # of .env-backend so a Grafana token is never in the app's environment.
    env_file:
      - .env-observability
    # No --server.http.listen-addr: the UI would otherwise be reachable from the app
    # containers, and nothing needs it. --storage.path keeps the remote_write WAL on a
    # volume, so a restart doesn't lose buffered metrics (the image's default is lost
    # when a custom command replaces it).
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only view of the host for the unix exporter. rslave so later host mounts are
      # visible without restarting the container.
      - /:/host:ro,rslave
      - alloy-data:/var/lib/alloy/data
    # Small and bounded: metrics collection must never be why the app runs out of memory.
    # Measured ~52 MB in practice, and an OOM here would only restart alloy, not the app.
    mem_limit: 200m
    # Deliberately not on the putyouon network: it only talks outbound to Grafana Cloud,
    # and the app has no reason to reach it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # remote_write write-ahead log, so a restart doesn't drop buffered metrics.
  alloy-data:

networks:
  putyouon:
    driver: bridge
