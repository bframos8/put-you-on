services:

  #db:
  # image: pgvector/pgvector:pg16
  # env_file: .env-postgres
  # volumes:
  #  - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - .env-backend
      - .env-postgres
    depends_on: [db]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://127.0.0.1
    depends_on: [backend]

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/localhost+1.pem:/certs/localhost+1.pem:ro
      - ./frontend/localhost+1-key.pem:/certs/localhost+1-key.pem:ro
    depends_on: [frontend, backend]

volumes:
  pgdata:
