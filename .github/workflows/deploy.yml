# Build to ECR, then deploy to the EC2 instance over SSM (gameplan 8.2 + 8.3).
#
# Trigger: CI finishing successfully on main, NOT `push: main`. ci.yml also runs on
# push, so a `push` trigger here would build and deploy while the tests were still
# running. Branch protection gates the *merge*, not the push that follows it.
#
# Because this is a workflow_run event, github.sha points at main's tip, which is not
# necessarily what CI tested. Everything below keys off the CI run's head_sha instead,
# so images, the checkout and the deployed commit are all the same SHA.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write # for the OIDC federation into AWS

env:
  AWS_REGION: us-east-1

jobs:
  build:
    # Never deploy a commit whose tests failed or were cancelled.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      # The registry host contains the AWS account id, so it is never written in this
      # file; it is read from the ECR login and passed to the deploy job.
      registry: ${{ steps.ecr.outputs.registry }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Licensed fonts: same private repo and deploy key as CI (A.3). Without them
      # next/font/local fails the frontend image build.
      - uses: actions/checkout@v7
        with:
          repository: bframos8/put-you-on-fonts
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
          path: .fonts
          persist-credentials: false
      - run: cp .fonts/*.ttf .fonts/*.otf frontend/src/assets/fonts/

      # OIDC: short-lived credentials, no AWS keys in GitHub (0.5). The role's trust
      # policy only accepts refs/heads/main, which is why this workflow is main-only.
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Separate cache scopes from ci.yml's backend build: same layers, but two
      # workflows writing one scope race each other.
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/putyouon/backend:${{ github.event.workflow_run.head_sha }}
            ${{ steps.ecr.outputs.registry }}/putyouon/backend:latest
          cache-from: type=gha,scope=deploy-backend
          cache-to: type=gha,scope=deploy-backend,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          # Inlined into the client bundle at build time and unfixable at runtime (2.5).
          # The Dockerfile fails the build if this is empty.
          build-args: |
            NEXT_PUBLIC_API_URL=https://putyouon.app
          tags: |
            ${{ steps.ecr.outputs.registry }}/putyouon/frontend:${{ github.event.workflow_run.head_sha }}
            ${{ steps.ecr.outputs.registry }}/putyouon/frontend:latest
          cache-from: type=gha,scope=deploy-frontend
          cache-to: type=gha,scope=deploy-frontend,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # SSM Run Command: no inbound SSH, and every deploy is audited (8.3).
      # Targeted by instance id (in a secret, since it is infrastructure detail) rather
      # than by tag: a tag-targeted SendCommand returns no instance id to poll for the
      # result, and this role deliberately can't list invocations.
      - name: Deploy over SSM
        env:
          REGISTRY: ${{ needs.build.outputs.registry }}
          SHA: ${{ needs.build.outputs.sha }}
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # The instance checks the repo out itself, then runs the deploy script from it,
          # so the commands here stay short and the real steps live in deploy/deploy.sh
          # (reviewable, and identical to what a manual run would do).
          # git isn't on the AL2023 AMI; installing it is idempotent and quick.
          # No `git clean`: the materialized .env files live in this directory.
          jq -n --arg sha "$SHA" --arg registry "$REGISTRY" '{
            executionTimeout: ["7200"],
            commands: [
              "set -eu",
              "command -v git >/dev/null || dnf install -y git",
              "if [ ! -d /opt/putyouon/.git ]; then git clone --filter=blob:none https://github.com/bframos8/put-you-on.git /opt/putyouon; fi",
              "git -C /opt/putyouon fetch --depth 1 origin \($sha)",
              "git -C /opt/putyouon checkout -q --detach FETCH_HEAD",
              "REGISTRY=\($registry) SHA=\($sha) bash /opt/putyouon/deploy/deploy.sh"
            ]
          }' > /tmp/params.json

          # executionTimeout is the real runtime cap; --timeout-seconds only bounds how
          # long the command may wait to be picked up. The first deploy pulls ~1.9 GB.
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${SHA:0:7}" \
            --parameters file:///tmp/params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          # Poll rather than `aws ssm wait command-executed`: that waiter gives up after
          # 100s and errors if called before the invocation exists.
          sleep 5
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) sleep 15 ;;
              *) break ;;
            esac
          done

          echo "--- instance output ---"
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          echo "--- instance errors ---"
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text

          echo "Final status: $status"
          [ "$status" = "Success" ]
